name: CI & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AutoSpanish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Clone ai-dev-tools
        shell: bash
        run: git clone --depth 1 https://github.com/DontKwo/ai-dev-tools.git "${{ runner.temp }}/_aitools"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Strict Linter and Link Check
        shell: bash
        run: |
          if ! uv run --no-project python "${{ runner.temp }}/_aitools/scripts/claudemd_linter.py" . --level strict --full --no-cache; then
            cat "${{ runner.temp }}/_aitools/scripts"/lint_report_*.txt || true
            exit 1
          fi
          uv run --no-project python "${{ runner.temp }}/_aitools/scripts/link_checker.py" .

      - name: Setup Gradle and Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Compute Next SemVer Release Version
        id: ver
        shell: python
        run: |
          import os, re, subprocess
          subprocess.run(["git", "fetch", "--tags", "--force"], check=False)
          raw_tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
          semvers = []
          for t in raw_tags:
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", t.strip())
              if m:
                  semvers.append(tuple(int(x) for x in m.groups()))
          base = max(semvers) if semvers else (0, 1, 0)
          next_ver = (base[0], base[1], base[2] + 1) if f"v{base[0]}.{base[1]}.{base[2]}" in raw_tags else base
          ver_str = f"{next_ver[0]}.{next_ver[1]}.{next_ver[2]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={ver_str}\ntag=v{ver_str}\n")
          print(f"Resolved version v{ver_str}")
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Bump Version Code and Name
        shell: python
        run: |
          from pathlib import Path
          import re
          ver = "${{ needs.lint-and-test.outputs.version }}"
          parts = [int(x) for x in ver.split(".")]
          code = parts[0] * 10000 + parts[1] * 100 + parts[2]
          gf = Path("app/build.gradle.kts")
          txt = gf.read_text(encoding="utf-8")
          txt = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {code}", txt)
          txt = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{ver}"', txt)
          gf.write_text(txt, encoding="utf-8")

      - name: Build Signed Release APK and Verify Certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          KEYSTORE_TMP="$(mktemp /tmp/autospanish-ks-XXXXXX.jks)"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_TMP"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_TMP"
          chmod +x ./gradlew
          ./gradlew assembleRelease --console=plain
          rm -f "$KEYSTORE_TMP"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "$CERT_INFO"
          if echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
            echo "ERROR: APK is signed with debug certificate" >&2
            exit 1
          fi
          if ! echo "$CERT_INFO" | grep -q "CN=AutoSpanish"; then
            echo "ERROR: APK missing CN=AutoSpanish certificate" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_PATH" release-assets/AutoSpanish-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: release-assets/AutoSpanish-Android.apk

  release:
    needs: [lint-and-test, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.lint-and-test.outputs.tag }}
          name: AutoSpanish ${{ needs.lint-and-test.outputs.tag }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            artifacts/android-package/AutoSpanish-Android.apk

  capture-screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Render Compose Screenshots via Robolectric Native Graphics
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --tests "com.autospanish.app.ui.ComposeScreenshotTest" --console=plain

      - name: Upload Rendered Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: app/build/screenshots/*.png
