name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: ClaudeMD Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ai-dev-tools for linter
        uses: actions/checkout@v4
        with:
          repository: DontKwo/ai-dev-tools
          path: .toolchain/ai-dev-tools

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ClaudeMD Strict Linter
        run: uv run --no-project python .toolchain/ai-dev-tools/scripts/claudemd_linter.py . --level strict --full --skip 46,47

      - name: Display Lint Report on Failure
        if: failure()
        run: |
          find .toolchain/ai-dev-tools/scripts/ -name "lint_report_*.txt" -exec cat {} + || true

  test-and-build:
    name: Test and Build APK
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK for release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AutoSpanish.apk
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          sha256sum AutoSpanish.apk app-debug.apk > SHA256SUMS.txt

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSpanish-debug-apk
          path: AutoSpanish.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Latest Build (Android APK)"
          body: |
            Automated Android APK build generated on push to `main` (${{ github.sha }}).

            ### Direct Download
            Download and install directly on your Android device:
            - **[AutoSpanish.apk](https://github.com/${{ github.repository }}/releases/download/latest/AutoSpanish.apk)**
            - **[app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)**
          prerelease: false
          make_latest: true
          files: |
            AutoSpanish.apk
            app-debug.apk
            SHA256SUMS.txt

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
